name: Deploy

# Todo push testa e publica: main → produção (BoulderLog-App), dev → testes (BoulderLog-Dev,
# chalkmark-dev.vsoller.com.br).
on:
  push:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-boulder-log-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Credenciais AWS via OIDC (sem access key)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: us-east-1
          mask-aws-account-id: true
      - name: cdk deploy
        run: npx cdk deploy ${{ github.ref_name == 'main' && 'BoulderLog-App' || 'BoulderLog-Dev' }} --require-approval never
        env:
          HOSTED_ZONE_ID: ${{ vars.HOSTED_ZONE_ID }}
          ALERT_EMAIL: ${{ vars.ALERT_EMAIL }}
          EMAIL_VIA_SES: ${{ vars.EMAIL_VIA_SES }}
          GOOGLE_OAUTH: ${{ vars.GOOGLE_OAUTH }}
          REPLY_TO_EMAIL: ${{ vars.REPLY_TO_EMAIL }}
          DEV_GOOGLE_OAUTH: ${{ vars.DEV_GOOGLE_OAUTH }}
